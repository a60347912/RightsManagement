<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版權週期管理 — 後台發布</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#3A352E; --ink-800:#4A443B; --ink-700:#5C5548;
    --paper:#F1EEE7; --paper-dim:#E5E1D7; --card:#FAF9F5;
    --brass:#8C8272; --seal:#A23324; --seal-bg:#F5DCD6;
    --sage:#6E7A68; --sage-bg:#E4E7DF; --line:#D6D0C2;
    --font-display:'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;
    --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    --font-mono:'IBM Plex Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink-900);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  #app{max-width:760px;margin:0 auto;padding:32px 20px 80px;}
  h1{font-family:var(--font-display);font-weight:900;font-size:22px;margin:0 0 4px;}
  .sub{font-size:12.5px;color:var(--ink-700);font-family:var(--font-mono);margin-bottom:24px;}
  .card{background:var(--card);border:1px solid var(--ink-900);border-radius:10px;padding:22px;
    box-shadow:3px 4px 0 rgba(18,32,59,0.08);margin-bottom:20px;}
  .card h2{font-family:var(--font-display);font-size:16px;margin:0 0 14px;}
  label{font-size:12px;color:var(--ink-700);font-weight:700;display:block;margin-bottom:5px;}
  input[type=password],input[type=text],textarea{
    width:100%;font-family:var(--font-body);border:1px solid var(--line);border-radius:6px;
    padding:9px 11px;font-size:13.5px;background:#fff;color:var(--ink-900);
  }
  textarea{font-family:var(--font-mono);font-size:12px;min-height:220px;resize:vertical;}
  button{font-family:var(--font-body);cursor:pointer;border-radius:6px;font-weight:600;font-size:13.5px;}
  .btn{border:1px solid var(--ink-900);background:var(--ink-900);color:var(--card);padding:9px 18px;}
  .btn:hover{background:var(--ink-800);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.secondary{background:transparent;color:var(--ink-900);}
  .btn.secondary:hover{background:var(--paper-dim);}
  .btn.small{padding:5px 11px;font-size:12px;}
  .btn.danger{border-color:var(--seal);background:transparent;color:var(--seal);}
  .btn.danger:hover{background:var(--seal-bg);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .hint{font-size:11.5px;color:var(--ink-700);margin-top:6px;line-height:1.6;}
  .status{margin-top:14px;padding:10px 13px;border-radius:6px;font-size:12.5px;line-height:1.6;border-left:3px solid var(--brass);background:var(--paper);}
  .status.ok{border-color:var(--sage);background:var(--sage-bg);color:#3d4a37;}
  .status.err{border-color:var(--seal);background:var(--seal-bg);color:var(--seal);}
  .status a{color:inherit;font-weight:700;}
  .file-drop{border:1.5px dashed var(--brass);border-radius:8px;padding:18px;text-align:center;
    font-size:13px;color:var(--ink-700);margin-bottom:12px;background:var(--paper);}
  .file-drop input{margin-top:8px;}
  .meta-line{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-700);margin:8px 0;}
  .hist-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;background:var(--paper);}
  .hist-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;}
  .hist-date{font-family:var(--font-mono);font-size:12px;color:var(--ink-800);font-weight:600;}
  .hist-msg{font-size:12.5px;color:var(--ink-800);margin-top:3px;}
  .hist-sha{font-family:var(--font-mono);font-size:10.5px;color:var(--brass);margin-top:3px;}
  .hist-actions{display:flex;gap:6px;flex-shrink:0;}
  .loading{color:var(--ink-700);font-size:12.5px;padding:10px 0;}
  #login-screen{max-width:360px;margin:14vh auto 0;text-align:center;}
  #login-screen .card{text-align:left;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;gap:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ⚠️ 部署後請把下面這個網址換成你自己的 Cloudflare Worker 網址
const WORKER_URL = "https://rights-admin.bill9256ee96.workers.dev";

let state = {
  loggedIn: false,
  password: '',
  loginError: '',
  loggingIn: false,
  pendingContent: '',
  pendingName: '',
  publishing: false,
  publishStatus: null, // {ok, message}
  history: [],
  historyLoading: false,
  historyError: '',
  historyPage: 1,
  historyHasNext: false,
  historyHasPrev: false,
  historyTotalPages: null,
  historyTotalCount: null,
  revertingSha: null,
  backups: [],
  backupsLoading: false,
  backupsError: '',
  restoringDate: null,
  commitMessageError: '',
};

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  }catch(e){ return iso; }
}
function fmtSize(str){
  const bytes = new TextEncoder().encode(str||'').length;
  if(bytes < 1024) return bytes + ' B';
  return (bytes/1024).toFixed(1) + ' KB';
}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers||{});
  if(state.password) headers['X-Admin-Password'] = state.password;
  const res = await fetch(WORKER_URL.replace(/\/$/,'') + path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: 'no-store',
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok || !data || data.ok === false){
    throw new Error((data && data.error) || ('連線失敗（狀態碼 ' + res.status + '）'));
  }
  return data;
}

async function doLogin(){
  const input = document.getElementById('pw-input');
  const pw = (input && input.value) || '';
  if(!pw){ return; }
  state.loggingIn = true; state.loginError=''; render();
  try{
    const r = await fetch(WORKER_URL.replace(/\/$/,'') + '/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pw})
    });
    const data = await r.json().catch(()=>null);
    if(r.ok && data && data.ok){
      state.password = pw;
      state.loggedIn = true;
      try{ sessionStorage.setItem('rm_admin_pw', pw); }catch(e){}
      state.loggingIn = false;
      render();
      loadHistory();
      loadBackups();
    } else {
      state.loggingIn = false;
      state.loginError = '密碼錯誤，請再試一次。';
      render();
    }
  }catch(e){
    state.loggingIn = false;
    state.loginError = '無法連線到後台服務，請確認網路連線或稍後再試。（' + (e.message||e) + '）';
    render();
  }
}
function loginKeydown(ev){ if(ev.key==='Enter') doLogin(); }
function logout(){
  state = Object.assign(state, { loggedIn:false, password:'', pendingContent:'', pendingName:'', publishStatus:null, history:[] });
  try{ sessionStorage.removeItem('rm_admin_pw'); }catch(e){}
  render();
}

function onFileChosen(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state.pendingContent = reader.result;
    state.pendingName = file.name;
    state.publishStatus = null;
    render();
  };
  reader.readAsText(file, 'utf-8');
}
function onPasteChange(ev){
  state.pendingContent = ev.target.value;
  state.publishStatus = null;
  const sizeEl = document.getElementById('size-display');
  if(sizeEl) sizeEl.textContent = fmtSize(state.pendingContent);
  const btn = document.getElementById('publish-btn');
  if(btn) btn.disabled = !state.pendingContent.trim() || state.publishing;
  const statusHolder = document.querySelector('.card .status');
  if(statusHolder && !state.publishStatus) statusHolder.remove();
}

function clearCommitMessageError(){
  if(state.commitMessageError){
    state.commitMessageError = '';
    const el = document.getElementById('commit-message-error');
    if(el){ el.style.display='none'; el.textContent=''; }
  }
}
async function doPublish(){
  const box = document.getElementById('content-box');
  if(box) state.pendingContent = box.value;
  if(!state.pendingContent.trim()){ return; }
  const msgInput = document.getElementById('commit-message');
  const customMessage = (msgInput && msgInput.value.trim()) || '';
  if(!customMessage){
    state.commitMessageError = '請填寫這次修改的說明，才能發布。';
    render();
    const el = document.getElementById('commit-message');
    if(el) el.focus();
    return;
  }
  state.commitMessageError = '';
  if(!confirm('確定要發布這個版本嗎？發布後網站大約 30 秒～1 分鐘後會更新。')) return;
  state.publishing = true; state.publishStatus = null; render();
  try{
    const data = await api('/publish', { method:'POST', body:{ content: state.pendingContent, message: customMessage } });
    state.publishing = false;
    state.publishStatus = { ok:true, message: '已成功發布！網站將在約 30 秒～1 分鐘後更新。', url: data.commitUrl };
    render();
    loadHistory(1);
  }catch(e){
    state.publishing = false;
    state.publishStatus = { ok:false, message: '發布失敗：' + (e.message||e) };
    render();
  }
}

async function loadHistory(page){
  page = page || state.historyPage || 1;
  state.historyLoading = true; state.historyError=''; render();
  try{
    const data = await api('/history?page=' + page);
    state.history = data.history || [];
    state.historyPage = data.page || page;
    state.historyHasNext = !!data.hasNext;
    state.historyHasPrev = !!data.hasPrev || state.historyPage > 1;
    state.historyTotalPages = data.totalPages || null;
    state.historyTotalCount = (typeof data.totalCount === 'number') ? data.totalCount : null;
  }catch(e){
    state.historyError = '無法讀取版本歷史：' + (e.message||e);
  }
  state.historyLoading = false;
  render();
}
let backupRunning = false;
async function runBackupNow(){
  if(backupRunning) return;
  backupRunning = true;
  const btn = document.getElementById('run-backup-btn');
  if(btn){ btn.disabled = true; btn.textContent = '備份中…'; }
  try{
    await api('/run-backup', { method:'POST' });
    await loadBackups();
    alert('已完成一次備份。');
  }catch(e){
    alert('備份失敗：' + (e.message||e));
  }
  backupRunning = false;
  if(btn){ btn.disabled = false; btn.textContent = '立即備份一次'; }
}
async function loadBackups(){
  state.backupsLoading = true; state.backupsError=''; render();
  try{
    const data = await api('/backups');
    state.backups = data.backups || [];
  }catch(e){
    state.backupsError = '無法讀取備份清單：' + (e.message||e);
  }
  state.backupsLoading = false;
  render();
}
function fmtBackupDate(dateStr){
  const [y,m,d] = (dateStr||'').split('-');
  return y ? `${y}/${m}/${d}` : dateStr;
}
async function restoreBackup(date){
  if(!confirm('確定要還原到「'+fmtBackupDate(date)+'」這份備份嗎？所有案件組的資料都會被還原成當天的內容，這個動作無法復原（除非再還原成更新的備份）。')) return;
  state.restoringDate = date; render();
  try{
    await api('/restore-backup', { method:'POST', body:{ date } });
    alert('已還原到 '+fmtBackupDate(date)+' 的備份，重新整理頁面即可看到還原後的資料。');
  }catch(e){
    alert('還原失敗：' + (e.message||e));
  }
  state.restoringDate = null;
  render();
}

function goToHistoryPage(page){
  if(page < 1) return;
  if(state.historyLoading) return;
  loadHistory(page);
}
async function doRevert(sha){
  if(!confirm('確定要回復到這個版本嗎？會把目前的內容改回這一版（原本的歷史不會被刪除，只是多一筆新的紀錄）。')) return;
  state.revertingSha = sha; render();
  try{
    await api('/revert', { method:'POST', body:{ sha } });
    state.publishStatus = { ok:true, message: '已回復到指定版本！網站將在約 30 秒～1 分鐘後更新。' };
    state.revertingSha = null;
    render();
    loadHistory(1);
  }catch(e){
    state.publishStatus = { ok:false, message: '回復失敗：' + (e.message||e) };
    state.revertingSha = null;
    render();
  }
}

function downloadVersion(sha){
  const url = WORKER_URL.replace(/\/$/,'') + '/download?sha=' + encodeURIComponent(sha);
  window.open(url, '_blank');
}
function downloadLatest(){
  const url = WORKER_URL.replace(/\/$/,'') + '/download';
  window.open(url, '_blank');
}

function renderLogin(){
  return `
  <div id="login-screen">
    <h1 style="text-align:center;">版權週期管理</h1>
    <div class="sub" style="text-align:center;">後台發布系統</div>
    <div class="card">
      <label>請輸入密碼</label>
      <input type="password" id="pw-input" placeholder="密碼" onkeydown="loginKeydown(event)" autofocus>
      <div class="row" style="margin-top:12px;">
        <button class="btn" style="flex:1;" onclick="doLogin()" ${state.loggingIn?'disabled':''}>${state.loggingIn?'登入中…':'登入'}</button>
      </div>
      ${state.loginError ? `<div class="status err">${esc(state.loginError)}</div>` : ''}
    </div>
  </div>`;
}

function renderMain(){
  return `
  <div class="top-row">
    <div>
      <h1>版權週期管理 — 後台發布</h1>
      <div class="sub">更新網站內容 ｜ 查看與回復歷史版本</div>
    </div>
    <button class="btn secondary small" onclick="logout()">登出</button>
  </div>

  <div class="card">
    <h2>發布新版本</h2>
    <div class="file-drop">
      選擇要發布的 index.html 檔案<br>
      <input type="file" accept=".html,text/html" onchange="onFileChosen(event)">
    </div>
    <label>或直接貼上 / 編輯完整的 HTML 內容</label>
    <textarea id="content-box" placeholder="貼上完整的 index.html 內容…" oninput="onPasteChange(event)">${esc(state.pendingContent)}</textarea>
    <label style="margin-top:12px;">這次修改說明（會顯示在下方版本歷史裡）<span style="color:var(--seal);">*</span></label>
    <input type="text" id="commit-message" placeholder="例如：新增左側案件組切換功能" style="margin-bottom:4px;" oninput="clearCommitMessageError()">
    <div id="commit-message-error" style="color:var(--seal);font-size:11.5px;margin-bottom:10px;${state.commitMessageError?'':'display:none;'}">${esc(state.commitMessageError||'')}</div>
    <div class="meta-line" id="meta-line">${state.pendingName?('已選擇檔案：'+esc(state.pendingName)+'　｜　'):''}目前內容大小：<span id="size-display">${fmtSize(state.pendingContent)}</span></div>
    <div class="row">
      <button class="btn" id="publish-btn" onclick="doPublish()" ${state.publishing || !state.pendingContent.trim() ? 'disabled':''}>
        ${state.publishing ? '發布中…' : '發布這個版本'}
      </button>
    </div>
    <div class="hint">發布後會直接更新到 GitHub 上的 index.html，網站大約 30 秒～1 分鐘後會顯示最新內容。</div>
    ${state.publishStatus ? `
      <div class="status ${state.publishStatus.ok?'ok':'err'}">
        ${esc(state.publishStatus.message)}
        ${state.publishStatus.url ? `　<a href="${esc(state.publishStatus.url)}" target="_blank" rel="noopener">查看這次的紀錄</a>` : ''}
      </div>` : ''}
  </div>

  <div class="card">
    <div class="top-row" style="margin-bottom:0;">
      <h2>最近版本</h2>
      <div class="row">
        <button class="btn secondary small" onclick="downloadLatest()">最新版本下載</button>
        <button class="btn secondary small" onclick="loadHistory()">重新整理</button>
      </div>
    </div>
    ${state.historyLoading ? '<div class="loading">讀取中…</div>' : ''}
    ${state.historyError ? `<div class="status err">${esc(state.historyError)}</div>` : ''}
    ${(!state.historyLoading && state.history.length===0 && !state.historyError) ? '<div class="loading">目前沒有版本紀錄。</div>' : ''}
    ${state.history.map((h,i) => `
      <div class="hist-item">
        <div class="hist-top">
          <div>
            <div class="hist-date">${fmtDate(h.date)}${(state.historyPage===1 && i===0) ? ' <span style="font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--sage);border:1px solid var(--sage);border-radius:999px;padding:1px 8px;margin-left:4px;">最新版本</span>' : ''}</div>
            <div class="hist-msg">${esc(h.message.split('\n')[0])}</div>
            <div class="hist-sha">${esc(h.sha.slice(0,7))} ｜ ${esc(h.author||'')}</div>
          </div>
          <div class="hist-actions">
            <button class="btn secondary small" onclick="window.open('${esc(h.previewUrl)}','_blank')">預覽</button>
            <button class="btn secondary small" onclick="downloadVersion('${esc(h.sha)}')">下載</button>
            <button class="btn danger small" onclick="doRevert('${esc(h.sha)}')" ${state.revertingSha===h.sha?'disabled':''}>
              ${state.revertingSha===h.sha ? '回復中…' : '回復到這版'}
            </button>
          </div>
        </div>
      </div>
    `).join('')}
    ${(!state.historyLoading && state.history.length>0) ? `
      <div class="row" style="justify-content:space-between;margin-top:10px;">
        <button class="btn secondary small" onclick="goToHistoryPage(${state.historyPage-1})" ${(!state.historyHasPrev || state.historyPage<=1)?'disabled':''}>‹ 上一頁</button>
        <div class="meta-line" style="margin:0;">第 ${state.historyPage} 頁${state.historyTotalPages?('／共 '+state.historyTotalPages+' 頁'):''}${(state.historyTotalCount!=null)?('（共 '+state.historyTotalCount+' 筆版本）'):''}</div>
        <button class="btn secondary small" onclick="goToHistoryPage(${state.historyPage+1})" ${!state.historyHasNext?'disabled':''}>下一頁 ›</button>
      </div>` : ''}
  </div>

  <div class="card">
    <div class="top-row" style="margin-bottom:0;">
      <h2>案件資料庫備份</h2>
      <div class="row">
        <button class="btn secondary small" id="run-backup-btn" onclick="runBackupNow()">立即備份一次</button>
        <button class="btn secondary small" onclick="loadBackups()">重新整理</button>
      </div>
    </div>
    <div class="hint">案件資料庫每天會自動備份一次，保留最近 10 天。如果資料被誤刪或改壞了，可以在這裡還原成之前某一天的內容。</div>
    ${state.backupsLoading ? '<div class="loading">讀取中…</div>' : ''}
    ${state.backupsError ? `<div class="status err">${esc(state.backupsError)}</div>` : ''}
    ${(!state.backupsLoading && state.backups.length===0 && !state.backupsError) ? '<div class="loading">目前還沒有任何備份紀錄（第一次自動備份要等排程執行後才會出現）。</div>' : ''}
    ${state.backups.map(b => `
      <div class="hist-item">
        <div class="hist-top">
          <div>
            <div class="hist-date">${fmtBackupDate(b.date)}</div>
            <div class="hist-sha">備份時間：${b.createdAt ? fmtDate(b.createdAt) : '—'}</div>
          </div>
          <div class="hist-actions">
            <button class="btn danger small" onclick="restoreBackup('${esc(b.date)}')" ${state.restoringDate===b.date?'disabled':''}>
              ${state.restoringDate===b.date ? '還原中…' : '還原這份備份'}
            </button>
          </div>
        </div>
      </div>
    `).join('')}
  </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = state.loggedIn ? renderMain() : renderLogin();
}

(function init(){
  let saved = null;
  try{ saved = sessionStorage.getItem('rm_admin_pw'); }catch(e){}
  if(saved){
    state.password = saved;
    state.loggedIn = true;
    render();
    loadHistory();
    loadBackups();
  } else {
    render();
  }
})();
</script>
</body>
</html>
